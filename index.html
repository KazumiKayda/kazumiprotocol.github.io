<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KazumiProtocol</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --accent:#aa55ff;
      --bg1:#0f0f14;
      --bg2:#1a1026;
      --text:#ffffff;
      --muted:rgba(255,255,255,.65);
      --glow:rgba(170,85,255,.35);
    }

    body{
      margin:0;
      min-height:100vh;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      color:var(--text);
      font-family:'Orbitron',system-ui,sans-serif;
      text-align:center;
      padding:70px 20px;
    }

    h1{
      font-size:3em;
      letter-spacing:3px;
      margin:0 0 10px;
    }

    .tagline{
      color:var(--muted);
      margin-bottom:45px;
    }

    .links{
      max-width:400px;
      margin:auto;
    }

    .links a{
      display:block;
      margin:14px auto;
      padding:15px 20px;
      border:2px solid var(--accent);
      color:var(--accent);
      text-decoration:none;
      border-radius:10px;
      transition:.2s ease;
    }

    .links a:hover{
      background:var(--accent);
      color:#000;
      box-shadow:0 0 18px var(--glow);
    }

    .contact{
      margin-top:50px;
      color:var(--muted);
    }

    .contact a{
      color:var(--accent);
      text-decoration:none;
    }

    .contact a:hover{
      text-decoration:underline;
    }

    footer{
      margin-top:70px;
      font-size:.8em;
      opacity:.4;
    }
  </style>
</head>

<body>

  <h1>KAZUMI PROTOCOL</h1>

  <p class="tagline">
    Cyberdragon VTuber • Gaming • Storytelling
  </p>

  <div class="links">

    <a href="https://youtube.com/@KazumiProtocol"
       target="_blank"
       rel="noopener">
      YouTube
    </a>

    <a href="https://twitch.tv/KazumiProtocol"
       target="_blank"
       rel="noopener">
      Twitch
    </a>

    <a href="https://tiktok.com/@KazumiProtocol"
       target="_blank"
       rel="noopener">
      TikTok
    </a>

  </div>

  <div class="contact">

    <h2>Contact</h2>

    <p>
      For business enquiries and collaborations:
    </p>

    <p>
      <a href="mailto:contact@kazumiprotocol.com">
        contact@kazumiprotocol.com
      </a>
    </p>

  </div>

  <footer>
    © Kazumi Protocol
  </footer>

</body>
</html>
